name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://portfolio.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Check the client bundle for secrets and the system prompt
        run: |
          if grep -rlE "sk-or-v1-|OPENROUTER_API_KEY|Sos el gemelo digital|Reglas de respuesta" .next/static; then
            echo "Secret or system prompt found in the client bundle"
            exit 1
          fi
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
